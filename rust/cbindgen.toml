# Configuration of the header generator (`make header`).
#
# cbindgen is pinned to 0.29.4 by the Makefile; CI regenerates the header and
# fails when `include/ngx_http_waf_ffi.h` is out of date.

language = "C"
include_guard = "NGX_HTTP_WAF_FFI_H"
tab_width = 4
line_length = 100
style = "both"
documentation = true
usize_is_size_t = true

header = """
/* The `kind` values of `ngx_waf_step_t`, mirrored from rust/src/types.rs. */
#define NGX_WAF_STEP_ALLOW          0
#define NGX_WAF_STEP_RESPONSE       1
#define NGX_WAF_STEP_INTERNAL_ERROR 2
#define NGX_WAF_STEP_RESOLVE_ADDR   3
#define NGX_WAF_STEP_HTTP_REQUEST   4

/* The `kind` values of `ngx_waf_event_t`. */
#define NGX_WAF_EVENT_RESOLVED_NAME  0
#define NGX_WAF_EVENT_RESOLVE_FAILED 1
#define NGX_WAF_EVENT_HTTP_RESPONSE  2
#define NGX_WAF_EVENT_HTTP_FAILED    3

/* The `content_type` values of `ngx_waf_step_t`. */
#define NGX_WAF_CT_HTML 0
#define NGX_WAF_CT_TEXT 1
"""

[export]
prefix = ""
# cbindgen exports every function of an `extern "C"` block, whatever the
# `include` list says, so the raw bindings of libmodsecurity (see
# rust/src/modsec.rs) are excluded by name here.
exclude = [
    "msc_init",
    "msc_set_log_cb",
    "msc_cleanup",
    "msc_create_rules_set",
    "msc_rules_add_file",
    "msc_rules_add_remote",
    "msc_rules_cleanup",
    "msc_new_transaction",
    "msc_new_transaction_with_id",
    "msc_transaction_cleanup",
    "msc_process_connection",
    "msc_process_uri",
    "msc_add_n_request_header",
    "msc_process_request_headers",
    "msc_append_request_body",
    "msc_process_request_body",
    "msc_update_status_code",
    "msc_intervention",
    "msc_process_logging",
    "ngx_http_waf_modsecurity_log",
    "ngx_http_waf_log_error",
    "free",
]
include = [
    "NgxWafStr",
    "NgxWafHeader",
    "NgxWafReq",
    "NgxWafStep",
    "NgxWafEvent",
    "ShmOps",
    "RegexOps",
    "ngx_waf_version",
    "ngx_waf_string_free",
    "ngx_waf_main_create",
    "ngx_waf_main_free",
    "ngx_waf_conf_create",
    "ngx_waf_conf_free",
    "ngx_waf_conf_cc_zone",
    "ngx_waf_conf_waf",
    "ngx_waf_conf_modsecurity",
    "ngx_waf_conf_captcha_api",
    "ngx_waf_conf_take_warning",
    "ngx_waf_directive",
    "ngx_waf_zone_directive",
    "ngx_waf_conf_merge",
    "ngx_waf_check_begin",
    "ngx_waf_check_resume",
    "ngx_waf_check_log",
    "ngx_waf_step_free",
    "ngx_waf_shm_zone_init",
    "ngx_waf_shm_zone_free",
    "ngx_waf_shm_zone_gc",
    "ngx_waf_should_gc",
    "ngx_waf_gc",
]

[export.rename]
"NgxWafStr" = "ngx_waf_str_t"
"NgxWafHeader" = "ngx_waf_header_t"
"NgxWafReq" = "ngx_waf_req_t"
"NgxWafStep" = "ngx_waf_step_t"
"NgxWafEvent" = "ngx_waf_event_t"
"ShmOps" = "ngx_waf_shm_ops_t"
"RegexOps" = "ngx_waf_regex_ops_t"

[fn]
args = "auto"
rename_args = "none"

[parse]
parse_deps = false

[parse.expand]
crates = []
all_features = false
