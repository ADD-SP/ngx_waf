# Configuration of the header generator (`mise run header`).
#
# cbindgen is pinned to 0.29.4 by `mise.toml`; CI regenerates the header and
# fails when `include/ngx_http_waf_ffi.h` is out of date.

language = "C"
include_guard = "NGX_HTTP_WAF_FFI_H"
tab_width = 4
line_length = 100
style = "both"
documentation = true
usize_is_size_t = true

[export]
prefix = ""
# Only the vocabulary of `rust/src/abi.rs` crosses the boundary: the
# constants, globals and typedefs of the implementation are never exported.
item_types = ["enums", "structs", "opaque", "functions"]
# cbindgen exports every function of an `extern "C"` block, whatever the
# `include` list says, so the raw bindings of libmodsecurity (see
# rust/src/modsecurity.rs) are excluded by name here.  The internal types the crate
# still declares `pub` are excluded as well, they are not part of the ABI.
exclude = [
    "msc_init",
    "msc_set_log_cb",
    "msc_cleanup",
    "msc_create_rules_set",
    "msc_rules_add_file",
    "msc_rules_add_remote",
    "msc_rules_cleanup",
    "msc_new_transaction",
    "msc_new_transaction_with_id",
    "msc_transaction_cleanup",
    "msc_process_connection",
    "msc_process_uri",
    "msc_add_n_request_header",
    "msc_process_request_headers",
    "msc_append_request_body",
    "msc_process_request_body",
    "msc_update_status_code",
    "msc_intervention",
    "msc_process_logging",
    "ngx_http_waf_modsecurity_log",
    "ngx_http_waf_log_error",
    "free",
    "BotId",
    "CheckKind",
    "TriggerKind",
]
include = [
    "NgxWafStringView",
    "NgxWafHeaderView",
    "NgxWafModSecurityRequestView",
    "NgxWafRequestView",
    "NgxWafStep",
    "NgxWafDecision",
    "NgxWafPending",
    "NgxWafEvent",
    "NgxWafZoneReferences",
    "NgxWafZoneHandles",
    "NgxWafSharedMemoryCallbacks",
    "NgxWafRegexCallbacks",
    "ngx_waf_version",
    "ngx_waf_string_free",
    "ngx_waf_main_configuration_create",
    "ngx_waf_main_configuration_free",
    "ngx_waf_location_configuration_create",
    "ngx_waf_location_configuration_free",
    "ngx_waf_location_configuration_enabled",
    "ngx_waf_location_configuration_modsecurity_enabled",
    "ngx_waf_location_configuration_zone_references",
    "ngx_waf_location_configuration_captcha_api",
    "ngx_waf_location_configuration_take_warning",
    "ngx_waf_directive_apply",
    "ngx_waf_zone_directive_apply",
    "ngx_waf_location_configuration_merge",
    "ngx_waf_inspection_begin",
    "ngx_waf_inspection_step",
    "ngx_waf_inspection_resume",
    "ngx_waf_inspection_log",
    "ngx_waf_inspection_free",
    "ngx_waf_shared_memory_zone_initialize",
    "ngx_waf_shared_memory_zone_free",
    "ngx_waf_shared_memory_zone_collect_garbage",
    "ngx_waf_should_collect_garbage",
    "ngx_waf_cache_collect_garbage",
]

[export.rename]
"NgxWafStringView" = "ngx_waf_string_view_t"
"NgxWafHeaderView" = "ngx_waf_header_view_t"
"NgxWafModSecurityRequestView" = "ngx_waf_modsecurity_request_view_t"
"NgxWafRequestView" = "ngx_waf_request_view_t"
"NgxWafStep" = "ngx_waf_step_t"
"NgxWafDecision" = "ngx_waf_decision_t"
"NgxWafPending" = "ngx_waf_pending_t"
"NgxWafEvent" = "ngx_waf_event_t"
"NgxWafZoneReferences" = "ngx_waf_zone_references_t"
"NgxWafZoneHandles" = "ngx_waf_zone_handles_t"
"NgxWafHttpMethod" = "ngx_waf_http_method"
"NgxWafHttpVersion" = "ngx_waf_http_version"
"NgxWafStepKind" = "ngx_waf_step_kind"
"NgxWafEventKind" = "ngx_waf_event_kind"
"NgxWafContentType" = "ngx_waf_content_type"
"NgxWafMainConfiguration" = "ngx_waf_main_configuration_t"
"NgxWafLocationConfiguration" = "ngx_waf_location_configuration_t"
"NgxWafInspectionHandle" = "ngx_waf_inspection_handle_t"
"NgxWafSharedMemoryCallbacks" = "ngx_waf_shared_memory_callbacks_t"
"NgxWafRegexCallbacks" = "ngx_waf_regex_callbacks_t"

[enum]
# `NGX_WAF_STEP_KIND_ALLOW`, the spelling the C glue uses for the values that
# used to be hand written macros.
rename_variants = "QualifiedScreamingSnakeCase"

[fn]
args = "auto"
rename_args = "none"

[parse]
parse_deps = false

[parse.expand]
crates = []
all_features = false

# The flags of `rust/src/flags.rs` are an implementation detail, the header
# never sees the macro.
[macro_expansion]
bitflags = false
