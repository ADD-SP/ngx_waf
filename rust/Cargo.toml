[package]
name = "ngx-waf-core"
version = "10.1.1"
edition = "2021"
publish = false
description = "The Rust core of the ngx_waf nginx module"
license = "BSD-2-Clause"

[lib]
name = "ngx_waf_core"
# `staticlib` is what nginx links against, `rlib` keeps `cargo test` working.
crate-type = ["staticlib", "rlib"]

[dependencies]
bitflags = "2"
getrandom = "0.3"
regex = "1"
# Parsing the answer of the captcha provider.
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
debug = false
