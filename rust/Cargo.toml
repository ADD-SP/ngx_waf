# The workspace of the Rust side of ngx_waf.
#
# `src/` is the core crate of the nginx module (the manifest lives next to
# `lib.rs`), `rule/` is the next generation DSL engine and `rule-cli/` is its
# command line tool.  nginx builds the core alone with
# `cargo build --manifest-path rust/src/Cargo.toml`.
[workspace]
members = ["src", "rule", "rule-cli"]
resolver = "2"
