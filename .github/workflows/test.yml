name: test

on:
  push:
    branches:
      - master
      - lts
      - lts-dev
      - current
      - current-dev
  pull_request:
  workflow_dispatch:


defaults:
  run:
    shell: bash

# cancel previous runs if new commits are pushed to the PR, but run for each commit on master
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true


jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the cargo artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.toml') }}

      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.4 --locked

      # The header is generated from rust/src/ffi.rs, a stale one would be a
      # trap for everyone building the module.
      - name: Check the FFI header is up to date
        run: |
          make header
          git diff --exit-code -- include/ngx_http_waf_ffi.h


  build_test:
    name: nginx ${{ matrix.nginx-version }} (${{ matrix.module-type }})
    runs-on: ubuntu-latest
    needs: [rust]

    strategy:
      fail-fast: false
      matrix:
        nginx-version: ['stable', 'mainline']
        module-type:  ['static', 'dynamic']

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install pre-requirements
        run: |
          sudo apt-get --yes update
          # https://github.com/actions/runner-images/issues/2139
          sudo apt-get remove nginx-core \
            nginx-full \
            nginx-light \
            nginx-extras \
            libgd3
          sudo apt-get install --yes \
            build-essential \
            zlib1g-dev \
            libpcre2-dev \
            libssl-dev \
            libperl-dev \
            cpanminus
          sudo cpanm --notest Test::Nginx

      - name: Download the nginx sources
        run: |
          sudo pip install lastversion
          lastversion download nginx:${{ matrix.nginx-version }}
          mkdir nginx-src
          tar zxf nginx-*.tar.gz --directory nginx-src --strip-components=1

      - name: Configure & build nginx
        run: |
          cd nginx-src
          if [ "${{ matrix.module-type }}" = 'static' ]; then
            opt='--add-module'
          else
            opt='--add-dynamic-module'
          fi

          ./configure ${opt}=${{ github.workspace }} \
            --with-http_realip_module \
            --with-cc-opt='-Wno-unused-but-set-variable -Wno-unused-function -fstack-protector-strong'
          make -j"$(nproc)"

      - name: Run the integration tests
        run: |
          cd test/test-nginx
          export MODULE_TEST_PATH=/tmp/module_test
          if [ "${{ matrix.module-type }}" = 'dynamic' ]; then
            export MODULE_PATH="${{ github.workspace }}/nginx-src/objs/ngx_http_waf_module.so"
          fi
          export TEST_NGINX_BINARY="${{ github.workspace }}/nginx-src/objs/nginx"
          sh ./init.sh

          # The templates of the inspections that are already ported.  The
          # under_attack and modsecurity ones are still missing (and the
          # ModSecurity cases of action.t), see rust/README.md.
          sh ./start.sh \
            t/DATA_EXPUNGED.t \
            t/args.t \
            t/bad_config.t \
            t/block_page.t \
            t/bug.t \
            t/bypass.t \
            t/cache.t \
            t/captcha.t \
            t/cc.t \
            t/cookie.t \
            t/disable.t \
            t/ipv4.t \
            t/ipv6.t \
            t/mode.t \
            t/post.t \
            t/referer.t \
            t/uri.t \
            t/user_agent.t \
            t/var.t \
            t/verify_bot.t
