name: test

on:
  push:
    branches:
      - master
      - lts*
      - current*
  pull_request:
  schedule:
    - cron: '0 0 * * SUN'
  workflow_dispatch:


defaults:
  run:
    shell: bash

jobs:
  native:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        nginx-version:
          - '1.18.0'
          - '1.20.2'
          - '1.22.1'
          - '1.24.0'
          - '1.26.3'
          - '1.28.3'
          - '1.30.7'
          - '1.31.9'
        install-type:  ['static module', 'dynamic module']

    env:
      LIB_INJECTION: ${{ github.workspace }}/libinjection

    steps:
      - name: Checkout sources
        uses: actions/checkout@v2

      - name: Checkout libinjection sources
        uses: actions/checkout@v2
        with:
          repository: 'libinjection/libinjection'
          path: 'libinjection-src'

      - uses: actions/setup-python@v2
        with:
          python-version: '3.x'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          sudo apt-get --yes update
          sudo apt-get install --yes libsodium23 libsodium-dev build-essential zlib1g-dev libssl-dev libxslt1-dev libxml2-dev libgeoip-dev libgd-dev libperl-dev uthash-dev flex bison
          sudo apt-get remove --yes python3-urllib3
          sudo pip install lastversion

      - name: Checkout PCRE1 sources
        run: |
          # Ubuntu 26 no longer provides libpcre3-dev. PCRE1 8.45 is the final
          # release, so let nginx build the official source tree statically.
          git clone --depth 1 https://github.com/PCRE2Project/pcre1.git pcre1
          (cd pcre1 && ./autogen.sh)

      - name: Install libinjection
        run: |
          cd libinjection-src
          ./autogen.sh
          ./configure --prefix=${{ env.LIB_INJECTION }}
          make -j$(nproc)
          sudo make install

      - name: Download nginx-${{ matrix.nginx-version }}
        run: |
          wget https://nginx.org/download/nginx-${{ matrix.nginx-version }}.tar.gz
          mkdir nginx-src
          tar zxf nginx-*.tar.gz --directory nginx-src --strip-components=1

      - name: Configure nginx-${{ matrix.install-type }}
        run: |
          make parser
          cd nginx-src
          if [ ${{ matrix.install-type }} = 'static module' ] ; then \
            opt='--add-module' ;\
          else \
            opt='--add-dynamic-module' ;\
          fi
          LIB_INJECTION=${{ env.LIB_INJECTION }} ./configure ${opt}=.. --with-pcre="${{ github.workspace }}/pcre1" --with-cc-opt='-Wno-unused-but-set-variable -Wno-unused-function -fstack-protector-strong -Wno-sign-compare' --with-http_realip_module

      - name: Install ${{ matrix.nginx-version }}
        run: |
          cd nginx-src
          make -j$(nproc)
          sudo make install
          sudo useradd nginx -s /sbin/nologin -M
          sudo chmod 777 -R /usr/local/nginx
          sudo ln -s /usr/local/nginx/sbin/nginx /usr/local/bin/nginx

      - name: Install Test::Nginx
        run: |
          if [ "${{ matrix.nginx-version }}" = "1.18.0" ]; then
            # Test::Nginx 0.31+ passes -e, which nginx 1.18 does not support.
            sudo cpan AGENT/Test-Nginx-0.30.tar.gz
          else
            sudo cpan Test::Nginx
          fi

      - name: Test
        run: |
          sudo chmod 777 -R /tmp
          cd test/test-nginx
          export MODULE_TEST_PATH=/tmp/module_test
          sh ./init.sh
          exec sudo sh start.sh t/*.t
