# A nginx configuration used by test/e2e/run.sh to verify the module against a
# real nginx build.  It mirrors the fixtures of test/test-nginx/template/*.t.

worker_processes  1;
daemon            off;
error_log         logs/error.log info;
pid               logs/nginx.pid;

events {
    worker_connections  64;
}

http {
    access_log        off;
    client_body_temp_path logs/body;
    proxy_temp_path       logs/proxy;
    fastcgi_temp_path     logs/fastcgi;
    uwsgi_temp_path       logs/uwsgi;
    scgi_temp_path        logs/scgi;

    waf_zone name=ngx_waf_test size=10m;
    # Five zones in total: a zone entry in `mcf->zones` used to be handed to the
    # shared memory init callback by value, and the fifth directive reallocates
    # that array (`ngx_array_create(..., 4, ...)`), which lost the handles of
    # every zone pushed before it.
    waf_zone name=ngx_waf_z2 size=5m;
    waf_zone name=ngx_waf_z3 size=5m;
    waf_zone name=ngx_waf_z4 size=5m;
    waf_zone name=ngx_waf_z5 size=5m;

    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Real-IP;

    server {
        listen 127.0.0.1:18080;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny off rate=100r/m;
        waf_cache on capacity=50;

        location /error {
            return 200 "[$waf_log][$waf_blocking_log][$waf_blocked][$waf_rule_type][$waf_rule_details][$waf_rate]";
        }

        location /bp {
            waf_block_page default;
        }

        # The error page of this location is a file: nginx internally redirects
        # to it, which is the case the stored decision must not be applied a
        # second time (a rewrite phase `return`, like `/error` above, would
        # answer before the access phase runs again).
        location /staticerror {
            error_page 403 /403.html;
        }

        error_page 403 /error;
        error_page 404 /error;
        error_page 503 /error;
    }

    server {
        listen 127.0.0.1:18081;
        root html;

        waf bypass;
        waf_mode FULL;
        waf_rule_path rules/;
    }

    server {
        listen 127.0.0.1:18082;
        root html;

        waf off;
        waf_mode FULL;
        waf_rule_path rules/;
    }

    server {
        listen 127.0.0.1:18083;
        root html;

        waf on;
        waf_mode GET;
        waf_rule_path rules/;
    }

    server {
        listen 127.0.0.1:18084;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny on rate=2r/m duration=1h zone=ngx_waf_test:cc2;

        location /ok {
            return 200 "ok";
        }

        location /error {
            return 200 "[$waf_log][$waf_blocking_log][$waf_blocked][$waf_rule_type][$waf_rule_details][$waf_rate]";
        }

        error_page 403 /error;
        error_page 503 /error;
    }

    # P1: `waf_action cc_deny=...` must leave the blacklist able to block.
    server {
        listen 127.0.0.1:18085;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny on rate=1r/m duration=1h zone=ngx_waf_test:cc3;
        waf_action cc_deny=400;
    }

    # P1: `waf_action blacklist=...` must leave the CC denial able to block.
    server {
        listen 127.0.0.1:18086;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny on rate=1r/m duration=1h zone=ngx_waf_test:cc4;
        waf_action blacklist=405;
    }

    # P2: a CC protection that cannot count blocks instead of serving.
    server {
        listen 127.0.0.1:18087;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny on rate=1r/m;
    }

    # Friendly crawler verification.  These servers have no `resolver`, so the
    # lookup always fails and the crawler is treated as a fake one.
    server {
        listen 127.0.0.1:18088;
        root html;

        waf on;
        waf_mode GET UA;
        waf_rule_path rules/;
        waf_verify_bot strict;
    }

    server {
        listen 127.0.0.1:18089;
        root html;

        waf on;
        waf_mode GET UA;
        waf_rule_path rules/;
        waf_verify_bot on;
    }

    # A stand-in for the captcha provider: it only has to answer JSON.
    server {
        listen 127.0.0.1:18090;

        location /ok {
            return 200 '{"success":true,"score":0.9}';
        }

        location /bad {
            return 200 '{"success":false}';
        }

        location /low {
            return 200 '{"success":true,"score":0.1}';
        }

        location /err {
            return 500 'oops';
        }

        location /junk {
            return 200 'not json';
        }
    }

    # The same provider over TLS, with a certificate the module is told not to
    # verify (the provider certificate cannot be checked without a CA bundle).
    server {
        listen 127.0.0.1:18443 ssl;
        ssl_certificate ssl/cert.pem;
        ssl_certificate_key ssl/key.pem;

        location /ok {
            return 200 '{"success":true,"score":0.9}';
        }

        # Only a client that sent the host name as its SNI is answered with a
        # success: the module has to hand the endpoint host over as a C string
        # (`$ssl_server_name` would carry whatever follows it otherwise).
        location /check {
            if ($ssl_server_name = "localhost") {
                return 200 '{"success":true}';
            }

            return 200 '{"success":false}';
        }
    }

    # The captcha flow: the server level uses the provider that accepts, the
    # locations below point at the other answers (each with its own
    # verification URL, a location only sees the requests that match it).
    server {
        listen 127.0.0.1:18091;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_captcha on prov=reCAPTCHAv2:checkbox secret=secret sitekey=key
            api=http://127.0.0.1:18090/ok;

        location /error {
            return 200 "[$waf_log][$waf_blocked][$waf_rule_type][$waf_rule_details]";
        }

        # No `waf_captcha` of its own: the inspection, the provider endpoint and
        # the verification URL (the default `/captcha`) are inherited from the
        # server level through the configuration merge.  The checks below post a
        # token to `/captcha`, which is the regression test for that.
        location /captcha {

        }

        location /bad/ {
            waf_captcha on prov=reCAPTCHAv2:checkbox secret=secret sitekey=key
                api=http://127.0.0.1:18090/bad verfiy=/bad/captcha;
        }

        location /err/ {
            waf_captcha on prov=reCAPTCHAv2:checkbox secret=secret sitekey=key
                api=http://127.0.0.1:18090/err verfiy=/err/captcha;
        }

        location /junk/ {
            waf_captcha on prov=reCAPTCHAv2:checkbox secret=secret sitekey=key
                api=http://127.0.0.1:18090/junk verfiy=/junk/captcha;
        }

        location /v3/ {
            waf_captcha on prov=reCAPTCHAv3 secret=secret sitekey=key score=0.5
                api=http://127.0.0.1:18090/low verfiy=/v3/captcha;
        }

        location /tls/ {
            waf_captcha on prov=reCAPTCHAv2:checkbox secret=secret sitekey=key
                api=https://127.0.0.1:18443/ok verfiy=/tls/captcha;
        }

        # The provider is addressed by name, the SNI has to be exactly
        # "localhost" (the stub answers success only then).
        location /tlsname/ {
            waf_captcha on prov=reCAPTCHAv2:checkbox secret=secret sitekey=key
                api=https://localhost:18443/check verfiy=/tlsname/captcha;
        }

        # The provider of this location is the stub of test/e2e/run.sh: it
        # accepts the connection and never answers, the module has to give up
        # on its own 5 second timeout.
        location /hang/ {
            waf_captcha on prov=reCAPTCHAv2:checkbox secret=secret sitekey=key
                api=http://127.0.0.1:18092/hang verfiy=/hang/captcha;
        }

        # The same stub over TLS: the handshake never completes, the module has
        # to give up without writing the request (the token and the secret)
        # into the socket in clear text.
        location /tlshang/ {
            waf_captcha on prov=reCAPTCHAv2:checkbox secret=secret sitekey=key
                api=https://127.0.0.1:18092/hang verfiy=/tlshang/captcha;
        }

        error_page 403 /error;
        error_page 503 /error;
    }

    # `waf_action X=CAPTCHA` challenges from the action table even when the
    # captcha inspection itself is off, so the provider endpoint is needed
    # there too - and it comes from the core (`off` still knows the default of
    # its provider).  The location has no `waf_captcha` of its own: the endpoint
    # has to be inherited.
    server {
        listen 127.0.0.1:18093;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_captcha off prov=reCAPTCHAv2:checkbox secret=secret sitekey=key
            api=http://127.0.0.1:18090/ok;
        waf_action blacklist=CAPTCHA zone=ngx_waf_test:action;

        location /captcha {

        }

        # No `api=`: the core answers with the default endpoint of the provider
        # and the glue has to parse that one.  Without network the request fails
        # closed, the point of the case is that nginx starts and the request is
        # answered at all.
        location /default/ {
            waf_captcha on prov=reCAPTCHAv2:checkbox secret=secret sitekey=key
                verfiy=/default/captcha;
        }
    }

    # `ngx_atoi()` accepts a leading zero, so a configuration written with one
    # (`rate=02r/m`, `duration=01h`) has to load and count.
    server {
        listen 127.0.0.1:18095;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny on rate=02r/m duration=01h zone=ngx_waf_test:cc5;
    }

    # The CC counter, the captcha action table and the captcha fail counter of
    # one server live in three different zones: each directive resolves its own
    # handle, which is where a missing or mixed up one shows.  `waf_captcha off`
    # keeps the captcha inspection inert, the action table of
    # `waf_action ...=CAPTCHA` is what challenges (and what the visitor solves).
    server {
        listen 127.0.0.1:18096;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        # The rate is high enough for the twenty one requests the fail counter
        # case needs; a missing handle still answers 500 for every request.
        waf_cc_deny on rate=100r/m duration=1h zone=ngx_waf_z2:cc;
        waf_captcha off prov=reCAPTCHAv2:checkbox secret=secret sitekey=key
            api=http://127.0.0.1:18090/ok max_fails=1:1m zone=ngx_waf_z4:fail;
        waf_action blacklist=CAPTCHA zone=ngx_waf_z3:action;

        # A path the static handler answers with 404 so that the inspection runs
        # (a rewrite phase `return` would answer before the access phase), the
        # error page prints what the inspection recorded.
        location /rate {

        }

        location /dump {
            return 200 "[$waf_rate][$waf_rule_type]";
        }

        error_page 404 /dump;
    }

    # A custom `waf_priority` decides which inspection answers first: both
    # servers below have the same ModSecurity rule and the same blacklisting
    # address, the first one runs ModSecurity before the address list and
    # answers with its policy (400) instead of the blacklist one (403).
    server {
        listen 127.0.0.1:18097;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny off rate=100r/m;
        waf_modsecurity on file=@PREFIX@/modsec.conf;
        waf_priority "MODSECURITY W-IP IP CC W-URL URL ARGS UA W-REFERER REFERER COOKIE POST CAPTCHA UNDER-ATTACK VERIFY-BOT";
        waf_action modsecurity=400 blacklist=403;
    }

    server {
        listen 127.0.0.1:18098;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny off rate=100r/m;
        waf_modsecurity on file=@PREFIX@/modsec.conf;
        waf_action modsecurity=400 blacklist=403;
    }

    # `waf_modsecurity` stops at the first phase that intervenes: the two rules
    # of modsec.conf match `/phase?phase=1`, the phase 1 one answers with its
    # own status even though the phase 2 one would redirect.
    server {
        listen 127.0.0.1:18100;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny off rate=100r/m;
        waf_modsecurity on file=@PREFIX@/modsec.conf;
    }

    # Both rule files of `waf_modsecurity` are loaded: the first one answers
    # `/phase?phase=1`, the second one `/second`.
    server {
        listen 127.0.0.1:18101;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny off rate=100r/m;
        waf_modsecurity on file=@PREFIX@/modsec.conf
            file=@PREFIX@/modsec-second.conf;
    }

    # A connection over a unix domain socket has no client address: the URL
    # rules still run, the address lists and the CC counters see nothing.
    server {
        listen unix:@PREFIX@/waf.sock;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny on rate=1r/m duration=1h zone=ngx_waf_test:cc6;
    }

    # The under attack page, its bytes are compared with the one of
    # `rust/data/` (see the `check_page` calls of run.sh).
    server {
        listen 127.0.0.1:18099;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_under_attack on;
    }
}
