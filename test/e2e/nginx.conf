# A nginx configuration used by test/e2e/run.sh to verify the module against a
# real nginx build.  It mirrors the fixtures of test/test-nginx/template/*.t.

worker_processes  1;
daemon            off;
error_log         logs/error.log info;
pid               logs/nginx.pid;

events {
    worker_connections  64;
}

http {
    access_log        off;
    client_body_temp_path logs/body;
    proxy_temp_path       logs/proxy;
    fastcgi_temp_path     logs/fastcgi;
    uwsgi_temp_path       logs/uwsgi;
    scgi_temp_path        logs/scgi;

    waf_zone name=ngx_waf_test size=10m;

    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Real-IP;

    server {
        listen 127.0.0.1:18080;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny off rate=100r/m;
        waf_cache on capacity=50;

        location /error {
            return 200 "[$waf_log][$waf_blocking_log][$waf_blocked][$waf_rule_type][$waf_rule_details][$waf_rate]";
        }

        location /bp {
            waf_block_page default;
        }

        error_page 403 /error;
        error_page 404 /error;
        error_page 503 /error;
    }

    server {
        listen 127.0.0.1:18081;
        root html;

        waf bypass;
        waf_mode FULL;
        waf_rule_path rules/;
    }

    server {
        listen 127.0.0.1:18082;
        root html;

        waf off;
        waf_mode FULL;
        waf_rule_path rules/;
    }

    server {
        listen 127.0.0.1:18083;
        root html;

        waf on;
        waf_mode GET;
        waf_rule_path rules/;
    }

    server {
        listen 127.0.0.1:18084;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny on rate=2r/m duration=1h zone=ngx_waf_test:cc2;

        location /ok {
            return 200 "ok";
        }

        location /error {
            return 200 "[$waf_log][$waf_blocking_log][$waf_blocked][$waf_rule_type][$waf_rule_details][$waf_rate]";
        }

        error_page 403 /error;
        error_page 503 /error;
    }

    # P1: `waf_action cc_deny=...` must leave the blacklist able to block.
    server {
        listen 127.0.0.1:18085;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny on rate=1r/m duration=1h zone=ngx_waf_test:cc3;
        waf_action cc_deny=400;
    }

    # P1: `waf_action blacklist=...` must leave the CC denial able to block.
    server {
        listen 127.0.0.1:18086;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny on rate=1r/m duration=1h zone=ngx_waf_test:cc4;
        waf_action blacklist=405;
    }

    # P2: a CC protection that cannot count blocks instead of serving.
    server {
        listen 127.0.0.1:18087;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny on rate=1r/m;
    }

    # Friendly crawler verification.  These servers have no `resolver`, so the
    # lookup always fails and the crawler is treated as a fake one.
    server {
        listen 127.0.0.1:18088;
        root html;

        waf on;
        waf_mode GET UA;
        waf_rule_path rules/;
        waf_verify_bot strict;
    }

    server {
        listen 127.0.0.1:18089;
        root html;

        waf on;
        waf_mode GET UA;
        waf_rule_path rules/;
        waf_verify_bot on;
    }

    # A stand-in for the captcha provider: it only has to answer JSON.
    server {
        listen 127.0.0.1:18090;

        location /ok {
            return 200 '{"success":true,"score":0.9}';
        }

        location /bad {
            return 200 '{"success":false}';
        }

        location /low {
            return 200 '{"success":true,"score":0.1}';
        }

        location /err {
            return 500 'oops';
        }

        location /junk {
            return 200 'not json';
        }
    }

    # The same provider over TLS, with a certificate the module is told not to
    # verify (the provider certificate cannot be checked without a CA bundle).
    server {
        listen 127.0.0.1:18443 ssl;
        ssl_certificate ssl/cert.pem;
        ssl_certificate_key ssl/key.pem;

        location /ok {
            return 200 '{"success":true,"score":0.9}';
        }
    }

    # The captcha flow: the server level uses the provider that accepts, the
    # locations below point at the other answers (each with its own
    # verification URL, a location only sees the requests that match it).
    server {
        listen 127.0.0.1:18091;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_captcha on prov=reCAPTCHAv2:checkbox secret=secret sitekey=key
            api=http://127.0.0.1:18090/ok;

        location /error {
            return 200 "[$waf_log][$waf_blocked][$waf_rule_type][$waf_rule_details]";
        }

        location /bad/ {
            waf_captcha on prov=reCAPTCHAv2:checkbox secret=secret sitekey=key
                api=http://127.0.0.1:18090/bad verfiy=/bad/captcha;
        }

        location /err/ {
            waf_captcha on prov=reCAPTCHAv2:checkbox secret=secret sitekey=key
                api=http://127.0.0.1:18090/err verfiy=/err/captcha;
        }

        location /junk/ {
            waf_captcha on prov=reCAPTCHAv2:checkbox secret=secret sitekey=key
                api=http://127.0.0.1:18090/junk verfiy=/junk/captcha;
        }

        location /v3/ {
            waf_captcha on prov=reCAPTCHAv3 secret=secret sitekey=key score=0.5
                api=http://127.0.0.1:18090/low verfiy=/v3/captcha;
        }

        location /tls/ {
            waf_captcha on prov=reCAPTCHAv2:checkbox secret=secret sitekey=key
                api=https://127.0.0.1:18443/ok verfiy=/tls/captcha;
        }

        error_page 403 /error;
        error_page 503 /error;
    }
}
