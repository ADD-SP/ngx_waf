# A nginx configuration used by test/e2e/run.sh to verify the module against a
# real nginx build.  It mirrors the fixtures of test/test-nginx/template/*.t.

worker_processes  1;
daemon            off;
error_log         logs/error.log info;
pid               logs/nginx.pid;

events {
    worker_connections  64;
}

http {
    access_log        off;
    client_body_temp_path logs/body;
    proxy_temp_path       logs/proxy;
    fastcgi_temp_path     logs/fastcgi;
    uwsgi_temp_path       logs/uwsgi;
    scgi_temp_path        logs/scgi;

    waf_zone name=ngx_waf_test size=10m;

    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Real-IP;

    server {
        listen 127.0.0.1:18080;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny off rate=100r/m;
        waf_cache on capacity=50;

        location /error {
            return 200 "[$waf_log][$waf_blocking_log][$waf_blocked][$waf_rule_type][$waf_rule_details][$waf_rate]";
        }

        location /bp {
            waf_block_page default;
        }

        error_page 403 /error;
        error_page 404 /error;
        error_page 503 /error;
    }

    server {
        listen 127.0.0.1:18081;
        root html;

        waf bypass;
        waf_mode FULL;
        waf_rule_path rules/;
    }

    server {
        listen 127.0.0.1:18082;
        root html;

        waf off;
        waf_mode FULL;
        waf_rule_path rules/;
    }

    server {
        listen 127.0.0.1:18083;
        root html;

        waf on;
        waf_mode GET;
        waf_rule_path rules/;
    }

    server {
        listen 127.0.0.1:18084;
        root html;

        waf on;
        waf_mode FULL;
        waf_rule_path rules/;
        waf_cc_deny on rate=2r/m duration=1h zone=ngx_waf_test:cc2;

        location /ok {
            return 200 "ok";
        }

        location /error {
            return 200 "[$waf_log][$waf_blocking_log][$waf_blocked][$waf_rule_type][$waf_rule_details][$waf_rate]";
        }

        error_page 403 /error;
        error_page 503 /error;
    }
}
